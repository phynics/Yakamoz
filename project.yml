name: Yakamoz
options:
  deploymentTarget:
    # Gnostic/Axoloty (the Gnostic client stack embedded by YakamozNetwork) require a
    # macOS 26 baseline, so the whole app moves with it. See ADR 0002 and issue #6.
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
    # PositronicKit's SwiftPM products are built for the host arch only, so build
    # Yakamoz for the active arch too (avoids x86_64 module-resolution failures on
    # Apple Silicon). This is a local dev/showcase app, not a universal release.
    ONLY_ACTIVE_ARCH: YES
    # Tests use `@testable import YakamozCore`, which requires the framework to be
    # built with -enable-testing.
    ENABLE_TESTABILITY: YES
packages:
  PositronicKit:
    url: https://github.com/phynics/PositronicKit.git
    exactVersion: "6.1.0-rc.1"
  # GnosticCore provides the consumer primitives (connection, discovery, catalog) that
  # YakamozNetwork wraps behind its own protocol seam. No consumable semver tag exists yet,
  # so this tracks `main` by revision (issue #6 allows "revision until a release exists").
  # BLOCKER: Gnostic `main` pins PositronicKit `exact: 5.1.0` while Yakamoz pins
  # `6.1.0-rc.1`; SwiftPM cannot co-resolve two exact pins on one package. This must move
  # to `exactVersion:` once Gnostic ships a tag built against the Yakamoz PositronicKit
  # line. Until then dependency resolution fails at build time — see PR notes.
  Gnostic:
    url: https://github.com/phynics/Gnostic.git
    branch: main
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.5.0"
  # Pin the transitive swift-json-schema to the same version PositronicKit builds
  # against on its public main branch. Without this,
  # Yakamoz can resolve a different release and the workspace ends up with a
  # mismatched JSONSchema builder API between the app and its embedded package
  # graph (this previously broke the build inside the dependency itself, e.g.
  # OrderedDictionary vs [String: JSONValue]).
  swift-json-schema:
    url: https://github.com/ajevans99/swift-json-schema
    exactVersion: 0.11.2
  # SwiftTerm provides a safe PTY-backed process layer (`LocalProcess`) for the terminal
  # workspace feature (YAK-T3). We use only its LocalProcess; the VT100 emulator and the
  # AppKit/UIKit terminal views are not used. Kept on YakamozCore so it never reaches the
  # app target, preserving the app-target import boundary.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.5.0"
  # MarkdownUI renders assistant turns as real SwiftUI views with full GitHub-flavored
  # markdown support (tables, nested lists, code blocks, thematic breaks) — things a
  # single `AttributedString`-backed `Text` cannot express (tables in particular). Kept
  # on the app target since it is pure view code.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
targets:
  Yakamoz:
    type: application
    platform: macOS
    sources:
      - Sources/Yakamoz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.atkn.Yakamoz
        PRODUCT_NAME: Yakamoz
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YakamozCore
      - target: YakamozNetwork
      - package: MarkdownUI
        product: MarkdownUI
  # Gnostic consumer client. Keeps MQTT/GnosticCore out of YakamozCore's local chat stack
  # (ADR 0002). One-way dependency: YakamozNetwork -> YakamozCore. The app target imports
  # YakamozNetwork but never a GnosticCore type; `Transport/GnosticCoreTransport.swift` is
  # the single file that imports GnosticCore.
  YakamozNetwork:
    type: framework
    platform: macOS
    sources:
      - Sources/YakamozNetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.atkn.YakamozNetwork
        PRODUCT_NAME: YakamozNetwork
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: YakamozCore
      - package: Gnostic
        product: GnosticCore
      - package: swift-log
        product: Logging
  YakamozCore:
    type: framework
    platform: macOS
    sources:
      - Sources/YakamozCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.atkn.YakamozCore
        PRODUCT_NAME: YakamozCore
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: PositronicKit
        product: PositronicKit
      - package: PositronicKit
        product: PKContracts
      - package: PositronicKit
        product: PKPrompt
      - package: PositronicKit
        product: PKOpenAIProvider
      - package: PositronicKit
        product: PKOpenRouterProvider
      - package: PositronicKit
        product: PKOllamaProvider
      - package: PositronicKit
      - package: PositronicKit
        product: PKAnthropicProvider
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-log
        product: Logging
  YakamozTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YakamozTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.atkn.YakamozTests
        PRODUCT_NAME: YakamozTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: YakamozCore
      - package: PositronicKit
        product: PositronicKit
      - package: PositronicKit
        product: PKContracts
      - package: PositronicKit
        product: PKPrompt
      - package: PositronicKit
        product: PKTestSupport
      - package: swift-log
        product: Logging
  YakamozNetworkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YakamozNetworkTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.atkn.YakamozNetworkTests
        PRODUCT_NAME: YakamozNetworkTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: YakamozNetwork
      - package: swift-log
        product: Logging
schemes:
  Yakamoz:
    build:
      targets:
        Yakamoz: all
        YakamozCore: all
        YakamozNetwork: all
    test:
      targets:
        - YakamozTests
        - YakamozNetworkTests
